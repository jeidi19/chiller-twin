# IIoT pipeline: simulator (OPC UA server) → gateway → MQTT → collector → InfluxDB → Grafana.
#   cp .env.example .env && docker compose up -d --build
#   Grafana on http://localhost:3000, InfluxDB on :8086, OPC UA on opc.tcp://localhost:4840
# The ML scorer is added in phase 3.

services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports:
      - "1883:1883"
    volumes:
      - ./infra/mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro

  influxdb:
    image: influxdb:2.7
    ports:
      - "8086:8086"
    environment:
      DOCKER_INFLUXDB_INIT_MODE: setup
      DOCKER_INFLUXDB_INIT_USERNAME: ${INFLUXDB_USERNAME}
      DOCKER_INFLUXDB_INIT_PASSWORD: ${INFLUXDB_PASSWORD}
      DOCKER_INFLUXDB_INIT_ORG: ${INFLUXDB_ORG}
      DOCKER_INFLUXDB_INIT_BUCKET: ${INFLUXDB_BUCKET}
      DOCKER_INFLUXDB_INIT_ADMIN_TOKEN: ${INFLUXDB_TOKEN}
    volumes:
      - influxdb-data:/var/lib/influxdb2

  grafana:
    image: grafana/grafana:11.2.0
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      # read by the provisioning files in grafana/provisioning/
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
    depends_on:
      - influxdb

  simulator:
    build: .
    command: >-
      python -m simulator serve --config configs/${SIM_CONFIG:-faults_example.yaml}
      --speed ${SIM_SPEED:-60} --loop
    ports:
      - "4840:4840"
    restart: unless-stopped

  gateway:
    build: .
    command: python -m gateway
    environment:
      OPCUA_ENDPOINT: opc.tcp://simulator:4840/chiller-twin/
      MQTT_HOST: mosquitto
      MACHINE_ID: ${MACHINE_ID:-bc-01}
    depends_on:
      - simulator
      - mosquitto
    restart: unless-stopped

  collector:
    build: .
    command: python -m collector
    environment:
      MQTT_HOST: mosquitto
      INFLUXDB_URL: http://influxdb:8086
      INFLUXDB_TOKEN: ${INFLUXDB_TOKEN}
      INFLUXDB_ORG: ${INFLUXDB_ORG}
      INFLUXDB_BUCKET: ${INFLUXDB_BUCKET}
    depends_on:
      - mosquitto
      - influxdb
    restart: unless-stopped

volumes:
  influxdb-data:
  grafana-data:
