[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "chiller-twin"
version = "0.1.0"
description = "Digital twin of a blast chiller with an IIoT pipeline (OPC UA, MQTT, InfluxDB, Grafana) and ML-based fault detection."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Jacopo De Donà" }]
dependencies = [
    "numpy>=1.26",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "chiller-twin[opcua,mqtt,influx]",
    "pytest>=8.0",
    "ruff>=0.6",
]
opcua = ["asyncua>=1.1"]
mqtt = ["paho-mqtt>=2.0"]
influx = ["influxdb-client>=1.40"]
# Phase 3: ml = ["pandas", "scikit-learn"]

[tool.setuptools.packages.find]
include = ["simulator*", "gateway*", "collector*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]
